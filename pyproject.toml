[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-using-agent"
version = "0.1.0"
description = "ToolMesh, a multi-conversation MCP tool-using agent"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "langchain-openai==1.6.7",
    "fastapi>=0.115,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["mcp_server*", "app*"]

[tool.setuptools.package-data]
"app.web" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
