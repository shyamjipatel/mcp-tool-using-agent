services:
  mcp-server:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    environment:
      MCP_TRANSPORT: streamable-http
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8001"

  agent:
    build: .
    depends_on:
      - mcp-server
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      LLM_MODEL: ${LLM_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
