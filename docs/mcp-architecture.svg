<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">ToolMesh MCP architecture</title>
  <desc id="diagram-description">The browser chat workspace calls FastAPI. FastAPI saves sessions and tool traces in SQLite and runs a LangGraph agent with a configurable model. The agent uses an MCP client to discover schemas and call tools on the MCP server over stdio locally or Streamable HTTP in Docker. The server exposes calculator, time, and weather tools; weather calls Open-Meteo.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf4f8"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2036"/>
      <stop offset="1" stop-color="#1b3b51"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#16314b" flood-opacity="0.09"/>
    </filter>
    <marker id="teal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#278a7e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#477fb9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#c18842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="24" fill="url(#page)"/>
  <path d="M24 0h1352a24 24 0 0 1 24 24v88H0V24A24 24 0 0 1 24 0Z" fill="url(#header)"/>
  <rect x="38" y="32" width="50" height="50" rx="14" fill="#80dac4"/>
  <text x="63" y="67" text-anchor="middle" fill="#113349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">M</text>
  <text x="107" y="56" fill="#f6fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750">ToolMesh</text>
  <text x="108" y="82" fill="#9bc2d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="2">MCP ARCHITECTURE</text>
  <text x="1360" y="61" text-anchor="end" fill="#a9c9d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">From a question to a tool-backed answer</text>

  <!-- The application host owns the agent and client, while the tool server is separate. -->
  <rect x="315" y="140" width="535" height="480" rx="25" fill="#eaf3f8" stroke="#b4ccdb" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="344" y="181" fill="#44738a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" letter-spacing="2">TOOLMESH HOST · FASTAPI PROCESS</text>

  <!-- Connections sit behind the cards so each arrow visibly ends at a boundary. -->
  <path d="M265 295H344" fill="none" stroke="#278a7e" stroke-width="3.5" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <path d="M565 295H604" fill="none" stroke="#278a7e" stroke-width="3.5" marker-end="url(#teal-arrow)"/>
  <path d="M820 295H894" fill="none" stroke="#278a7e" stroke-width="3.5" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <path d="M455 365V444" fill="none" stroke="#c18842" stroke-width="3.5" marker-start="url(#amber-arrow)" marker-end="url(#amber-arrow)"/>
  <path d="M712 365V444" fill="none" stroke="#477fb9" stroke-width="3.5" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <path d="M820 518H894" fill="none" stroke="#477fb9" stroke-width="3.5" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <path d="M1180 590V654" fill="none" stroke="#477fb9" stroke-width="3.5" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>

  <!-- Entry point. -->
  <rect x="35" y="225" width="230" height="140" rx="18" fill="#ffffff" stroke="#d7e4ec" stroke-width="2" filter="url(#shadow)"/>
  <rect x="35" y="225" width="230" height="7" rx="3" fill="#72cbb7"/>
  <text x="56" y="263" fill="#408878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">BROWSER CLIENT</text>
  <text x="56" y="301" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">Chat workspace</text>
  <text x="56" y="331" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Sessions and tool traces</text>

  <!-- Host API and agent. -->
  <rect x="345" y="225" width="220" height="140" rx="18" fill="#ffffff" stroke="#d7e4ec" stroke-width="2" filter="url(#shadow)"/>
  <rect x="345" y="225" width="220" height="7" rx="3" fill="#72cbb7"/>
  <text x="366" y="263" fill="#408878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">HTTP API</text>
  <text x="366" y="301" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">FastAPI routes</text>
  <text x="366" y="331" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Chat and session API</text>

  <rect x="605" y="225" width="215" height="140" rx="18" fill="#ffffff" stroke="#d7e4ec" stroke-width="2" filter="url(#shadow)"/>
  <rect x="605" y="225" width="215" height="7" rx="3" fill="#72cbb7"/>
  <text x="626" y="263" fill="#408878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">AGENT RUNTIME</text>
  <text x="626" y="301" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">LangGraph</text>
  <text x="626" y="331" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Bounded model/tool loop</text>

  <!-- The provider can be a remote API or the in-process deterministic demo. -->
  <rect x="895" y="225" width="470" height="140" rx="18" fill="#ffffff" stroke="#d7e4ec" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="225" width="470" height="7" rx="3" fill="#72cbb7"/>
  <text x="917" y="263" fill="#408878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">MODEL DECISION + ANSWER</text>
  <text x="917" y="301" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">Configurable model</text>
  <text x="917" y="331" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Hugging Face default · OpenAI · local · demo</text>
  <text x="917" y="351" fill="#8295a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Remote API, local endpoint, or in-process demo</text>

  <!-- Persistence and MCP client. -->
  <rect x="345" y="445" width="220" height="145" rx="18" fill="#ffffff" stroke="#e7d6b7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="345" y="445" width="220" height="7" rx="3" fill="#dfac67"/>
  <text x="366" y="483" fill="#a87837" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">PERSISTENCE</text>
  <text x="366" y="522" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">SQLite</text>
  <text x="366" y="551" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Sessions, messages</text>
  <text x="366" y="572" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">and tool traces</text>

  <rect x="605" y="445" width="215" height="145" rx="18" fill="#ffffff" stroke="#cddff0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="605" y="445" width="215" height="7" rx="3" fill="#78a9d5"/>
  <text x="626" y="483" fill="#477fb9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">MCP CLIENT</text>
  <text x="626" y="522" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">Discover + call</text>
  <text x="626" y="551" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Tool schemas</text>
  <text x="626" y="572" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">and validated inputs</text>

  <!-- MCP server owns tool implementations. -->
  <rect x="895" y="445" width="470" height="145" rx="18" fill="#ffffff" stroke="#cddff0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="895" y="445" width="470" height="7" rx="3" fill="#78a9d5"/>
  <text x="917" y="483" fill="#477fb9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.8">SEPARATE MCP SERVER</text>
  <text x="917" y="517" fill="#162941" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">Advertised tools</text>
  <rect x="917" y="534" width="125" height="30" rx="8" fill="#eaf3fc"/>
  <rect x="1050" y="534" width="158" height="30" rx="8" fill="#eaf3fc"/>
  <rect x="1216" y="534" width="128" height="30" rx="8" fill="#eaf3fc"/>
  <text x="979" y="554" text-anchor="middle" fill="#386c9c" font-family="ui-monospace,Menlo,monospace" font-size="13">calculate</text>
  <text x="1129" y="554" text-anchor="middle" fill="#386c9c" font-family="ui-monospace,Menlo,monospace" font-size="13">get_current_time</text>
  <text x="1280" y="554" text-anchor="middle" fill="#386c9c" font-family="ui-monospace,Menlo,monospace" font-size="13">get_weather</text>
  <text x="917" y="580" fill="#667c92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Also exposes a demo support-policy resource</text>

  <rect x="35" y="652" width="815" height="70" rx="15" fill="#e8f1f7" stroke="#cbdde9" stroke-width="1.5"/>
  <text x="55" y="679" fill="#47738d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.5">MCP BOUNDARY</text>
  <text x="55" y="704" fill="#294660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">tools/list → schema validation → tools/call · stdio locally / Streamable HTTP in Docker</text>

  <rect x="1015" y="655" width="330" height="67" rx="15" fill="#eaf3fc" stroke="#cddff0" stroke-width="1.5"/>
  <text x="1036" y="682" fill="#477fb9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="1.5">WEATHER PROVIDER</text>
  <text x="1036" y="707" fill="#294660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Open-Meteo</text>
</svg>
